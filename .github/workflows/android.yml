name: Android
on:
  push:
    branches: [main, android-full-client]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo test --manifest-path native/Cargo.toml
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: icy-vpn-debug
          path: app/build/outputs/apk/debug/*.apk